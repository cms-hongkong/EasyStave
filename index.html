<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡雅音樂教室彩虹樂譜</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 頂部資訊區 -->
        <header class="top-bar">
            <input type="text" id="song-title" placeholder="點擊輸入歌名..." value="卡雅音樂教室彩虹樂譜">
            <div class="controls-row">
                <select id="clef-select">
                    <option value="treble">高音譜號</option>
                    <option value="bass">低音譜號</option>
                    <option value="grand" selected>大譜表(高+低)</option>
                </select>
                <select id="time-select">
                    <option value="4/4">4/4 拍</option>
                    <option value="3/4">3/4 拍</option>
                    <option value="2/4">2/4 拍</option>
                </select>
                <select id="lines-per-page">
                    <option value="3">每頁 3 行</option>
                    <option value="4">每頁 4 行</option>
                    <option value="5" selected>每頁 5 行</option>
                </select>
                <button id="toggle-color" class="action-btn highlight">🎨 彩色: 開</button>
            </div>
            <div class="controls-row">
                <button id="play-all-btn" class="action-btn" style="background:#4cd964; color:white;">▶ 播放</button>
                <button id="stop-btn" class="action-btn" style="background:#ff3b30; color:white;">⏹️ 停止</button>
                <button id="undo-btn" class="action-btn">↩ 復原</button>
                <button id="clear-btn" class="action-btn">🗑️ 清除</button>
                <button id="export-pdf-btn" class="action-btn" style="background:#ff9500; color:white;">🖨️ 匯出 PDF</button>
            </div>
        </header>

        <!-- 工具列 -->
        <section class="tools-bar">
            <div class="tool-group">
                <button class="dur-btn" data-dur="w">全音</button>
                <button class="dur-btn" data-dur="hd">附點2分</button>
                <button class="dur-btn" data-dur="h">2分</button>
                <button class="dur-btn" data-dur="qd">附點4分</button>
                <button class="dur-btn active" data-dur="q">4分</button>
                <button class="dur-btn" data-dur="8">8分</button>
                <button id="rest-btn" class="action-btn" style="background:#ffd6d6; margin-left:3px; padding:6px;">❌ 休止</button>
            </div>

            <div class="tool-group" style="background:#f8f9fa; border:1px solid #dae0e5; border-radius:8px; padding:2px 8px;">
                <label class="radio-label"><input type="radio" name="acc" value="" checked> 無</label>
                <label class="radio-label"><input type="radio" name="acc" value="#"> ♯</label>
                <label class="radio-label"><input type="radio" name="acc" value="b"> ♭</label>
                <label class="radio-label"><input type="radio" name="acc" value="n"> ♮</label>
            </div>
            
            <div class="tool-group">
                <select id="fingering-select" style="background:#e8f4f8; font-weight:bold;">
                    <option value="none">指法: 無</option>
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option>
                </select>
                <select id="octave-select" style="background:#f3e5f5; font-weight:bold;">
                    <option value="1">高(+1)</option>
                    <option value="0" selected>音域:標準</option>
                    <option value="-1">低(-1)</option>
                    <option value="-2">極低(-2)</option>
                </select>
                <label class="checkbox-label">
                    <input type="checkbox" id="chord-mode"> ➕ 和弦疊加
                </label>
            </div>

            <!-- 大譜表專用輸入位置 -->
            <div class="tool-group" id="grand-staff-target" style="display:none; width:100%; justify-content:center; background:#fff3cd; padding:6px 12px; border-radius:8px; border:2px solid #ffe69c; margin-top:5px;">
                <span style="font-size:16px; font-weight:bold; color:#856404;">✍️ 目前寫入至:</span>
                <select id="track-select" style="background:white; font-weight:bold; border:1px solid #ccc; border-radius:4px; padding:4px 8px; outline:none; font-size:16px; color:#d9534f; cursor:pointer; margin-left:10px;">
                    <option value="treble">高音譜表 (右手)</option>
                    <option value="bass">低音譜表 (左手)</option>
                </select>
            </div>

            <!-- 修改提示區 -->
            <div class="tool-group" id="edit-status-container" style="width:100%; background:#e6f2ff; padding:4px 10px; border-radius:8px; border:1px solid #b3d9ff; justify-content:center; margin-top:5px;">
                <button id="edit-prev" class="action-btn" style="padding:2px 8px;">⬅️</button>
                <span id="edit-status" style="font-size:14px; font-weight:bold; color:#333; margin:0 8px;">✨ 點選音符或按箭嘴修改</span>
                <button id="edit-next" class="action-btn" style="padding:2px 8px;">➡️</button>
                <button id="cancel-edit-btn" class="action-btn" style="display:none; padding:2px 8px; font-size:12px; margin-left:8px; background:#ff4d4d; color:white; border:none;">取消</button>
            </div>
        </section>

        <!-- 琴鍵 -->
        <section class="keyboard-bar">
            <button class="note-btn" style="background:#ffcccc; color:#cc0000;" data-note="c/4">C</button>
            <button class="note-btn" style="background:#ffe6cc; color:#cc6600;" data-note="d/4">D</button>
            <button class="note-btn" style="background:#ffffcc; color:#cccc00;" data-note="e/4">E</button>
            <button class="note-btn" style="background:#ccffcc; color:#009900;" data-note="f/4">F</button>
            <button class="note-btn" style="background:#cce6ff; color:#0066cc;" data-note="g/4">G</button>
            <button class="note-btn" style="background:#ccccff; color:#0000cc;" data-note="a/4">A</button>
            <button class="note-btn" style="background:#e6ccff; color:#6600cc;" data-note="b/4">B</button>
            <button class="note-btn" style="background:#ffcccc; color:#cc0000;" data-note="c/5">高C</button>
        </section>

        <!-- 樂譜顯示區 -->
        <main class="score-container" id="score-wrapper"></main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
